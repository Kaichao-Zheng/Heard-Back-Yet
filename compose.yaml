services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: heardbackyet-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - heardbackyet_pgdata:/var/lib/postgresql

volumes:
  heardbackyet_pgdata:
