services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: heardbackyet-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - heardbackyet_pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    profiles: ["cloud"]
    build:
      context: .
      dockerfile: Dockerfile
    image: heardbackyet-api:local
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  fastapi:
    profiles: ["cloud"]
    build:
      context: .
      dockerfile: Dockerfile
    image: heardbackyet-api:local
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  nginx:
    profiles: ["cloud"]
    image: nginx:1.28-alpine
    environment:
      API_DOMAIN: "${API_DOMAIN:-localhost}"
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
    depends_on:
      fastapi:
        condition: service_healthy
    restart: unless-stopped

volumes:
  heardbackyet_pgdata:
